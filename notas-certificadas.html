<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notas Certificadas</title>
  <link rel="icon" type="image/png" href="sello.png" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #dfe3e7;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      padding: 18px;
      display: flex;
      justify-content: center;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 0 auto 16px;
    }
    .actions button {
      border: 0;
      border-radius: 6px;
      background: #1d4e89;
      color: #fff;
      font: 700 15px/1 Arial, Helvetica, sans-serif;
      padding: 10px 16px;
      cursor: pointer;
    }
    .actions button:last-child {
      background: #4b5563;
    }
    .page-shell {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: center;
    }
    .page {
      display: block;
      width: min(100%, 920px);
      height: auto;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      background: #fff;
    }
    @media print {
      html, body { background: #fff; }
      .actions { display: none !important; }
      body { padding: 0; }
      .page-shell { width: 100%; max-width: none; }
      .page { box-shadow: none; border: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div style="width:100%;max-width:960px;">
    <nav class="actions" aria-label="Acciones del documento">
      <button type="button" onclick="window.print()">Imprimir / Guardar PDF</button>
      <button type="button" onclick="window.location.href = 'registro.html'">Regresar</button>
    </nav>

    <div class="page-shell">
      <img class="page" src="reference-cert.png" alt="Certificación de calificaciones EMG" />
    </div>
  </div>
</body>
</html>
