<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notas Certificadas</title>
  <link rel="icon" type="image/png" href="sello.png" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #dfe3e7;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      padding: 18px;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 0 auto 16px;
    }
    .actions button {
      border: 0;
      border-radius: 6px;
      background: #1d4e89;
      color: #fff;
      font: 700 15px/1 Arial, Helvetica, sans-serif;
      padding: 10px 16px;
      cursor: pointer;
    }
    .actions button:last-child {
      background: #4b5563;
    }
    .viewer-wrap {
      width: min(980px, 100%);
      margin: 0 auto;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      position: relative;
    }
    .pdf-stage {
      position: relative;
      width: 100%;
      min-height: 1200px;
      background: #fff;
    }
    .pdf-view {
      display: block;
      width: 100%;
      height: 1200px;
      border: 0;
      background: #fff;
      pointer-events: none;
    }
    .form-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .field {
      position: absolute;
      display: block;
      pointer-events: auto;
    }
    .field input {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(0,0,0,0.22);
      background: rgba(255,255,255,0.15);
      color: #111;
      font: 600 12px/1.2 Arial, Helvetica, sans-serif;
      text-align: left;
      padding: 4px 6px;
      border-radius: 3px;
    }
    .field input:focus {
      outline: 2px solid rgba(30, 64, 175, 0.6);
      background: rgba(255,255,255,0.6);
    }
    .subject-table {
      position: absolute;
      left: 66px;
      top: 620px;
      width: 720px;
      height: 260px;
      border: 0;
      pointer-events: auto;
    }
    .subject-table table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }
    .subject-table th,
    .subject-table td {
      border: 1px solid rgba(0,0,0,0.7);
      padding: 0;
      background: rgba(255,255,255,0.08);
    }
    .subject-table th {
      height: 32px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      background: rgba(255,255,255,0.15);
    }
    .subject-table td {
      height: 28px;
    }
    .subject-table input {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      font: 600 11px/1 Arial, Helvetica, sans-serif;
      color: #111;
      text-align: center;
      padding: 4px 6px;
    }
    .subject-table input:focus {
      outline: 2px solid rgba(30,64,175,0.6);
      background: rgba(255,255,255,0.5);
    }
    @page {
      size: A4 portrait;
      margin: 0;
    }
    @media print {
      html, body { background: #fff; }
      .actions { display: none !important; }
      body { padding: 0; }
      .viewer-wrap { max-width: none; width: 100vw; border: 0; box-shadow: none; }
      .pdf-stage, .pdf-view { height: 100vh; min-height: 100vh; }
    }
  </style>
</head>
<body>
  <nav class="actions" aria-label="Acciones del documento">
    <button type="button" onclick="window.print()">Imprimir / Guardar PDF</button>
    <button type="button" onclick="window.location.href = 'registro.html'">Regresar</button>
  </nav>

  <div class="viewer-wrap">
    <div class="pdf-stage">
      <object
        class="pdf-view"
        data="./Certificación%20de%20Calificaciones%20EMG.pdf#toolbar=0&navpanes=0&scrollbar=0&view=FitH"
        type="application/pdf"
        title="Certificación de Calificaciones EMG"
        aria-label="Certificación de Calificaciones EMG"
      >
        <embed src="./Certificación%20de%20Calificaciones%20EMG.pdf#toolbar=0&navpanes=0&scrollbar=0&view=FitH" type="application/pdf" style="width: 100%; height: 1200px; border: 0; background: #fff;" />
      </object>

      <form class="form-overlay" aria-label="Formulario de edición del certificado">
        <label class="field" style="left: 147px; top: 150px; width: 510px; height: 26px;">
          <input type="text" value="Deyalit Soranger Mendez Laya" aria-label="Nombre del estudiante" />
        </label>

        <label class="field" style="left: 164px; top: 205px; width: 210px; height: 26px;">
          <input type="text" value="2026-2027" aria-label="Año escolar" />
        </label>

        <label class="field" style="left: 445px; top: 205px; width: 220px; height: 26px;">
          <input type="text" value="4to Año" aria-label="Grado" />
        </label>

        <label class="field" style="left: 168px; top: 252px; width: 182px; height: 26px;">
          <input type="text" value="EMG" aria-label="Sección" />
        </label>

        <label class="field" style="left: 418px; top: 252px; width: 250px; height: 26px;">
          <input type="text" value="María García" aria-label="Representante o docente" />
        </label>

        <label class="field" style="left: 186px; top: 325px; width: 470px; height: 26px;">
          <input type="text" value="Certificación de Calificaciones" aria-label="Certificación" />
        </label>

        <div class="subject-table">
          <table aria-label="Cuadro de calificaciones">
            <thead>
              <tr>
                <th style="width: 38%;">Asignatura</th>
                <th style="width: 18%;">1er</th>
                <th style="width: 18%;">2do</th>
                <th style="width: 18%;">3er</th>
                <th style="width: 8%;">Prom.</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><input type="text" value="Matemática" /></td>
                <td><input type="text" value="17" /></td>
                <td><input type="text" value="18" /></td>
                <td><input type="text" value="19" /></td>
                <td><input type="text" value="18" /></td>
              </tr>
              <tr>
                <td><input type="text" value="Lengua y Literatura" /></td>
                <td><input type="text" value="17" /></td>
                <td><input type="text" value="18" /></td>
                <td><input type="text" value="18" /></td>
                <td><input type="text" value="18" /></td>
              </tr>
              <tr>
                <td><input type="text" value="Ciencias Naturales" /></td>
                <td><input type="text" value="16" /></td>
                <td><input type="text" value="17" /></td>
                <td><input type="text" value="18" /></td>
                <td><input type="text" value="17" /></td>
              </tr>
              <tr>
                <td><input type="text" value="Historia" /></td>
                <td><input type="text" value="18" /></td>
                <td><input type="text" value="18" /></td>
                <td><input type="text" value="17" /></td>
                <td><input type="text" value="18" /></td>
              </tr>
              <tr>
                <td><input type="text" value="Educación Física" /></td>
                <td><input type="text" value="19" /></td>
                <td><input type="text" value="19" /></td>
                <td><input type="text" value="20" /></td>
                <td><input type="text" value="19" /></td>
              </tr>
            </tbody>
          </table>
        </div>

        <label class="field" style="left: 120px; top: 900px; width: 145px; height: 28px;">
          <input type="text" value="30/11/2026" aria-label="Fecha de emisión" />
        </label>

        <label class="field" style="left: 430px; top: 900px; width: 200px; height: 28px;">
          <input type="text" value="Lic. Ana López" aria-label="Director o responsable" />
        </label>
      </form>
    </div>
  </div>
</body>
</html>
