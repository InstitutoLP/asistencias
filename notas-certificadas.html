<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notas Certificadas</title>
  <link rel="icon" type="image/png" href="sello.png" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #dfe3e7;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      padding: 18px;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 0 auto 16px;
    }
    .actions button {
      border: 0;
      border-radius: 6px;
      background: #1d4e89;
      color: #fff;
      font: 700 15px/1 Arial, Helvetica, sans-serif;
      padding: 10px 16px;
      cursor: pointer;
    }
    .actions button:last-child {
      background: #4b5563;
    }
    .viewer-wrap {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .pdf-view {
      display: block;
      width: 100%;
      min-height: 100vh;
      max-height: 100vh;
      border: 0;
      background: #fff;
    }
    @page {
      size: A4 portrait;
      margin: 0;
    }
    @media print {
      html, body {
        background: #fff;
      }
      .actions {
        display: none !important;
      }
      body {
        padding: 0;
      }
      .viewer-wrap {
        max-width: none;
        width: 100vw;
        height: 100vh;
        border: 0;
        box-shadow: none;
      }
      .pdf-view {
        min-height: 100vh;
        height: 100vh;
      }
    }
  </style>
</head>
<body>
  <nav class="actions" aria-label="Acciones del documento">
    <button type="button" onclick="window.print()">Imprimir / Guardar PDF</button>
    <button type="button" onclick="window.location.href = 'registro.html'">Regresar</button>
  </nav>

  <div class="viewer-wrap">
    <object
      class="pdf-view"
      data="./Certificación%20de%20Calificaciones%20EMG.pdf#toolbar=0&navpanes=0&scrollbar=0&view=FitH"
      type="application/pdf"
      title="Certificación de Calificaciones EMG"
      aria-label="Certificación de Calificaciones EMG"
    >
      <embed
        src="./Certificación%20de%20Calificaciones%20EMG.pdf#toolbar=0&navpanes=0&scrollbar=0&view=FitH"
        type="application/pdf"
        style="width: 100%; height: 100vh; border: 0; background: #fff;"
      />
    </object>
  </div>
</body>
</html>
