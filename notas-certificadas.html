<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notas Certificadas</title>
  <link rel="icon" type="image/png" href="sello.png" />
  <style>
    :root {
      --pdf-width: 820px;
      --pdf-height: 1120px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: #dfe3e7;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 18px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 0 auto 16px;
    }

    .actions button {
      border: 0;
      border-radius: 8px;
      background: #1d4e89;
      color: #fff;
      font: 700 15px/1 Arial, Helvetica, sans-serif;
      padding: 10px 18px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .actions button:last-child {
      background: #4b5563;
    }

    .viewer-wrap {
      position: relative;
      width: min(92vw, var(--pdf-width));
      margin: 0 auto;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.14);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .pdf-view {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 820 / 1120;
      border: 0;
      background: #fff;
      z-index: 0;
    }

    .edit-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .field {
      position: absolute;
      display: block;
      pointer-events: auto;
      border-radius: 2px;
      overflow: hidden;
    }

    .field input {
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: #0f172a;
      font: 600 11px/1.2 Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 0 4px;
      pointer-events: auto;
      box-shadow: none;
    }

    .field input:focus {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 4px;
    }

    .field input::placeholder {
      color: rgba(15, 23, 42, 0.5);
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html, body {
        background: #fff;
      }

      .actions {
        display: none !important;
      }

      body {
        padding: 0;
      }

      .viewer-wrap {
        width: 100vw;
        max-width: none;
        margin: 0;
        border: 0;
        box-shadow: none;
      }

      .edit-overlay {
        position: absolute;
      }
    }
  </style>
</head>
<body>
  <nav class="actions" aria-label="Acciones del documento">
    <button type="button" onclick="window.print()">Imprimir / Guardar PDF</button>
    <button type="button" onclick="window.location.href = 'registro.html'">Regresar</button>
  </nav>

  <div class="viewer-wrap">
    <object
      class="pdf-view"
      data="./Certificación%20de%20Calificaciones%20EMG.pdf#toolbar=0&navpanes=0&scrollbar=0&view=FitH"
      type="application/pdf"
      title="Certificación de Calificaciones EMG"
      aria-label="Certificación de Calificaciones EMG"
    >

      <label class="field" style="left: 17%; top: 57%; width: 12%; height: 2.5%;">

      </label>

      <label class="field" style="left: 46%; top: 67%; width: 15%; height: 2.5%;">
        <input type="text" value="EMG" aria-label="Grado" />
      </label>

      <label class="field" style="left: 64%; top: 67%; width: 16%; height: 2.5%;">
        <input type="text" value="2024" aria-label="Año" />
      </label>
    </form>
  </div>
</body>
</html>
